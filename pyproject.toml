[project]
name = "vbuild"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "rich-toolkit>=0.20.5",
    "typer>=0.27.2",
]

[project.scripts]
vbuild = "vbuild.cli:main"

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"
